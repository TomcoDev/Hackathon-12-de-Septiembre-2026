<!-- Tailwind 3.4.16 vendorizado. preflight APAGADO a proposito: su reset
     pisaria el CSS de abajo y perderiamos el diseno afinado para el video. -->
<script src="vendor/tailwind.js"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: { extend: { colors: {
      bg: "#0b0d11", panel: "#12151b", panel2: "#171b23", line: "#232935",
      txt: "#e8eaf0", dim: "#8a93a6", mute: "#4f5768",
      ok: "#6fd39a", warn: "#f2b45c", priv: "#8ab4ff", bad: "#ef7b7b",
    } } },
  };
</script>

<style>
  :root {
    --bg:#0b0d11; --panel:#12151b; --panel2:#171b23; --line:#232935; --txt:#e8eaf0; --dim:#8a93a6; --mute:#4f5768;
    --ok:#6fd39a; --okbg:#12261c; --warn:#f2b45c; --warnbg:#2a2113; --priv:#8ab4ff; --privbg:#121a2b; --bad:#ef7b7b;
  }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--txt); font:14.5px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column }
  a { color:var(--ok) }
  button { background:#1d2230; color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:7px 13px; cursor:pointer; font-size:13.5px; font-family:inherit }
  button:hover { border-color:#3d475a } button.primary { background:var(--ok); color:#07130c; border-color:var(--ok); font-weight:700 }
  button.mini { padding:2px 8px; font-size:12px } button.on { background:#2a3140; border-color:#4a556c }
  select { background:#1d2230; color:var(--txt); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px }
  button:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid var(--priv); outline-offset:2px }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important } }

  /* ---------- header ---------- */
  header { display:flex; align-items:center; gap:22px; padding:12px 24px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap }
  .brand h1 { margin:0; font-size:15px; letter-spacing:3px; font-weight:800 }
  .brand p { margin:2px 0 0; color:var(--dim); font-size:12.5px }
  .controles { display:flex; gap:8px; align-items:center }
  .contador { display:flex; gap:28px; margin-left:auto; font-variant-numeric:tabular-nums }
  .contador > div { text-align:right; min-width:86px }
  .contador b { display:block; font-size:34px; line-height:1; font-weight:800; letter-spacing:-1px }
  .contador span { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1.2px }
  .contador .anoto b { color:var(--ok) } .contador .hablo b { color:var(--warn) }
  .progreso { height:3px; background:var(--line) } .progreso div { height:100%; width:0; background:var(--ok); transition:width .15s linear }

  /* ---------- narración ---------- */
  .estado { padding:10px 24px; background:var(--panel2); border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; min-height:46px }
  .estado .punto { width:9px; height:9px; border-radius:50%; background:var(--mute); flex:none; margin-top:6px }
  .estado.leyendo .punto { background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:latido 1.4s infinite }
  .estado.hablo .punto { background:var(--warn) }
  @keyframes latido { 0%{box-shadow:0 0 0 0 rgba(111,211,154,.6)} 70%{box-shadow:0 0 0 9px rgba(111,211,154,0)} 100%{box-shadow:0 0 0 0 rgba(111,211,154,0)} }
  .estado b { font-size:17px } .estado span { color:var(--dim) }
  .estado.hablo { background:var(--warnbg); border-bottom-color:#4a3a1a }
  .estado.hablo b { color:var(--warn) }
  .estado code { background:#1d2230; border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:12.5px }

  /* ---------- columnas ---------- */
  main { flex:1; display:grid; grid-template-columns:1.05fr 1fr 1fr; min-height:0 }
  section { overflow-y:auto; padding:16px 20px; border-right:1px solid var(--line); min-height:0 }
  section:last-child { border-right:0 }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--dim); margin:0 0 4px; font-weight:700 }
  h2 + .sub { color:var(--mute); font-size:12px; margin:0 0 14px }
  .ic { width:14px; height:14px; vertical-align:-2px; flex:none; fill:currentColor }
  button .ic { vertical-align:-3px; margin-right:5px }

  /* ---------- grupo ---------- */
  .msg { display:flex; gap:10px; padding:5px 8px 5px 10px; margin:0 -8px 3px; border-left:3px solid transparent; border-radius:0 8px 8px 0 }
  .msg .quien { font-weight:700; min-width:58px; font-size:13px }
  .msg .texto { flex:1 } .msg .hora { color:var(--mute); font-size:11.5px; white-space:nowrap }
  .msg.trigger { background:var(--warnbg); border-left-color:var(--warn) !important; box-shadow:inset 0 0 0 1px #4a3a1a }
  .msg.plan { background:var(--privbg); border-left-color:var(--priv) !important }
  .tag { display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; margin-left:8px; vertical-align:1px; text-transform:uppercase; letter-spacing:.6px; font-weight:700 }
  .tag.warn { background:var(--warn); color:#1a1200 } .tag.priv { background:var(--priv); color:#0a1226 } .tag.ok { background:var(--ok); color:#07130c }
  .tag.gris { background:#2a3140; color:var(--dim) }

  /* ---------- agente ---------- */
  .caja { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px }
  .caja h3 { margin:0 0 8px; font-size:12px; color:var(--dim); font-weight:700; text-transform:uppercase; letter-spacing:1px }
  .plan li { margin:2px 0 } .plan .de { color:var(--mute); font-size:12px }
  .embudo .fila { display:grid; grid-template-columns:150px 32px 1fr; gap:8px; align-items:center; font-size:12.5px; color:var(--dim); margin:3px 0 }
  .embudo .fila b { text-align:right; font-variant-numeric:tabular-nums; color:var(--txt) }
  .embudo .barra { height:8px; background:#2a3140; border-radius:4px } .embudo .fila.ok .barra { background:var(--ok) } .embudo .fila.ok { color:var(--ok) }
  .filtros { display:flex; gap:6px; margin:4px 0 10px }
  .dec { padding:7px 10px 7px 12px; border-left:3px solid var(--line); margin-bottom:6px; font-size:13px; color:var(--dim); border-radius:0 6px 6px 0 }
  .dec .cab { display:flex; gap:8px; align-items:center } .dec .cab .cuando { margin-left:auto; color:var(--mute); font-size:11.5px }
  .dec.anoto { border-left-color:var(--ok); background:var(--okbg); color:var(--txt) }
  .dec.anoto .que { margin:4px 0 2px; font-style:italic; color:#cfd4dd }
  .dec.anoto .meta { font-size:12px; color:var(--dim) } .dec.anoto .meta .fp { color:var(--warn) } .dec.anoto .meta .conf { color:var(--ok) }
  .dec.hablo { border-left-color:var(--warn); background:var(--warnbg); color:var(--warn); font-weight:600 }
  .dec.err { border-left-color:var(--bad) }
  details summary { cursor:pointer; color:var(--mute); font-size:12px; margin-top:4px } details p { margin:4px 0 0; color:var(--dim); font-size:12.5px; border-left:2px solid var(--line); padding-left:8px }

  /* ---------- privado ---------- */
  .nada { color:var(--mute); text-align:center; padding:60px 20px; line-height:1.7 } .nada .g { font-size:34px; margin-bottom:10px }
  .disparo { background:var(--warnbg); border:1px solid #4a3a1a; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px }
  .disparo b { color:var(--warn) } .disparo q { display:block; margin-top:4px; color:var(--txt) }
  .dm { background:var(--privbg); border:1px solid #243354; border-radius:14px 14px 14px 4px; padding:16px 18px; position:relative }
  .dm .de { font-size:12px; color:var(--priv); font-weight:700; letter-spacing:.5px; margin-bottom:10px; display:flex; align-items:center; gap:8px }
  .dm .de .listo { margin-left:auto; color:var(--ok); font-weight:600 }
  .dm p { margin:0 0 12px }
  .b { display:grid; grid-template-columns:22px 1fr auto; gap:6px 8px; margin-bottom:11px; align-items:start }
  .b .n { color:var(--dim) } .b .t { line-height:1.45 }
  .b .acc { display:flex; gap:6px; align-items:center; white-space:nowrap } .b .acc a { font-size:12px; text-decoration:none } .b .acc a:hover { text-decoration:underline }
  .b .acc button { color:var(--dim) } .b .acc button:hover { color:var(--bad); border-color:var(--bad) }
  .b .ev { grid-column:2 / 4; font-size:12px; color:var(--mute); margin-top:-4px }
  .b .ev q { color:var(--dim) }
  .fp { color:var(--warn); font-size:12px; font-weight:600 }
  .dm .pie { color:var(--dim); font-size:13px; border-top:1px solid #243354; padding-top:12px; margin-top:8px }
  .dm .pie .cta { margin-top:12px; display:flex; gap:10px; align-items:center }
  .dm .pie .cta small { color:var(--mute) }
  .vacio { color:var(--mute); font-style:italic }
  @media (max-width: 1100px) { main { grid-template-columns:1fr 1fr } section.privado { grid-column:1 / 3; border-top:1px solid var(--line) } }
</style>
<style>
  /* Agregados de la version React */
  .col-head { position:sticky; top:0; z-index:2; background:var(--bg);
              margin:0 -20px; padding:14px 20px 8px; border-bottom:1px solid var(--line) }
  section { padding-top:0 }
  .col-head h2 { margin:0 0 3px } .col-head .sub { margin:0 }
  .umbral { margin-left:auto; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums }
  .embudo .fila { grid-template-columns:150px 32px 1fr 44px }
  .embudo .pct { text-align:right; font-size:11.5px; color:var(--mute); font-variant-numeric:tabular-nums }
  .dec.abierta { box-shadow:inset 0 0 0 1px #2f4a3a }
  .b { border-radius:8px; padding:4px 6px; margin-left:-6px; transition:background .15s ease }
  .b:hover { background:#162034 }
  /* El seguimiento del replay saltaba de golpe en cada repintado. */
  section { scroll-behavior:smooth }
  @media (prefers-reduced-motion: reduce) { section { scroll-behavior:auto } }

  /* ── Celular: la pagina scrollea entera y las columnas se apilan ── */
  @media (max-width: 760px) {
    /* Sin esto el body queda fijo y cada columna scrollea por su cuenta:
       en un telefono son tres cajitas de 200px que no se pueden leer. */
    html, body { height:auto; overflow:visible }
    body { font-size:15px }

    header { gap:12px; padding:12px 16px }
    .brand h1 { font-size:14px; letter-spacing:2px }
    .brand p { font-size:12px }
    /* El selector ocupa su fila y los dos botones comparten la de abajo:
       asi "Reproducir el mes" entra en una linea y no queda desparejo. */
    .controles { width:100%; gap:8px; flex-wrap:wrap }
    .controles select { flex:1 1 100%; padding:11px 10px; font-size:14px }
    .controles button { flex:1 1 0; padding:11px 10px; font-size:14px; white-space:nowrap;
                        display:inline-flex; align-items:center; justify-content:center }

    /* Los tres numeros, en fila y completos: es el plano que prueba el silencio. */
    .contador { width:100%; margin-left:0; gap:0; display:grid; grid-template-columns:repeat(3,1fr) }
    .contador > div { min-width:0; text-align:center }
    .contador b { font-size:27px; letter-spacing:-.5px }
    .contador span { font-size:10px; letter-spacing:.6px; display:block; line-height:1.25 }

    .estado { padding:10px 16px }
    .estado b { font-size:15px }

    main { display:block }
    section { border-right:0; border-bottom:1px solid var(--line); padding:0 16px 18px }
    .col-head { margin:0 -16px; padding:12px 16px 8px }
    /* El grupo es un feed vivo: se acota para poder llegar al resto sin scrollear un mes. */
    section.publico { max-height:62vh; overflow-y:auto }
    section.agente, section.privado { overflow:visible }

    .msg { padding:6px 8px 6px 10px }
    .msg .quien { min-width:46px; font-size:12.5px }
    .msg .hora { font-size:11px }

    /* 150px de etiqueta no entran: el motivo pasa a ocupar la fila completa. */
    .embudo .fila { grid-template-columns:1fr auto auto; gap:6px 8px }
    .embudo .barra { grid-column:1 / -1; height:6px }

    .b { grid-template-columns:20px 1fr; gap:4px 8px }
    .b .acc { grid-column:2; justify-content:flex-start; margin-top:2px }
    .b .ev { grid-column:1 / -1 }
    .dm { border-radius:12px; padding:14px }
    .dm .pie .cta { flex-direction:column; align-items:flex-start }
  }


  /* Scrollbar propia: la nativa de Windows es gris claro y rompe el tema en camara. */
  section, .entregable .cuerpo, .dm { scrollbar-width:thin; scrollbar-color:#2c3442 transparent }
  section::-webkit-scrollbar, .dm::-webkit-scrollbar { width:11px; height:11px }
  section::-webkit-scrollbar-track, .dm::-webkit-scrollbar-track { background:transparent }
  section::-webkit-scrollbar-thumb, .dm::-webkit-scrollbar-thumb {
    background:#2c3442; border-radius:99px; border:3px solid var(--bg); background-clip:padding-box }
  section::-webkit-scrollbar-thumb:hover, .dm::-webkit-scrollbar-thumb:hover { background:#3d475a; background-clip:padding-box }
  section::-webkit-scrollbar-thumb:active { background:var(--ok); background-clip:padding-box }
  section::-webkit-scrollbar-corner { background:transparent }
</style>
</head>
<body>
