<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL TESTIGO</title>
<style>
  /* hackathon 12/09/2026 — MOCK DE REFERENCIA, NO ES LA PANTALLA DEL DEMO.
     La pantalla real es public/index.html, cableada al servidor de Luis.
     Esto es un mock autónomo con datos inventados y su propia forma de datos,
     que NO sigue src/tipos.ts. Se deja solo por dos ideas que quizá valga la
     pena portar a public/: la etiqueta sobre el mensaje disparador diciendo que
     no menciona al bot, y la cita textual que se abre debajo del bullet para
     verificar sin salir de la pantalla.
     Si no se portan, borrar este archivo antes de entregar. */
  :root {
    --bg:        #0e1013;
    --panel:     #161a20;
    --panel-2:   #1b212a;
    --borde:     #262d38;
    --texto:     #e8ecf2;
    --tenue:     #8b95a5;
    --anotado:   #3fb950;
    --descarte:  #6e7681;
    --error:     #d29922;
    --acento:    #58a6ff;
    --fuera:     #f778ba;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--texto);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Cabecera: el contador es la prueba de que el silencio no es inactividad ── */
  header {
    border-bottom: 1px solid var(--borde);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 28px;
    flex-wrap: wrap;
  }
  .marca { font-size: 19px; font-weight: 650; letter-spacing: .14em; }
  .marca span { color: var(--tenue); font-weight: 400; letter-spacing: 0; margin-left: 12px; font-size: 14px; }

  .contador { display: flex; gap: 26px; margin-left: auto; align-items: flex-end; }
  .metrica { text-align: right; }
  .metrica .n {
    font-size: 30px; font-weight: 680; font-variant-numeric: tabular-nums;
    line-height: 1; display: block;
  }
  .metrica .r { font-size: 12px; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; }
  .metrica.destacada .n { color: var(--anotado); font-size: 38px; }
  .metrica.destacada .r { color: var(--anotado); }
  .metrica.hablo .n { color: var(--acento); }

  .modo {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--borde); color: var(--tenue); white-space: nowrap;
  }
  .modo.vivo { color: var(--anotado); border-color: var(--anotado); }

  /* ── Dos columnas ── */
  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    background: var(--borde); min-height: 0;
    transition: grid-template-columns .5s cubic-bezier(.2,.8,.3,1);
  }
  /* Cuando llega el privado, el grupo y la bitácora se corren: nada queda tapado. */
  main.con-entregable { grid-template-columns: 1fr 1fr 470px; }
  .col { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  .col-entregable { display: none; background: var(--panel); }
  main.con-entregable .col-entregable { display: flex; }
  .col h2 {
    margin: 0; padding: 11px 22px; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .1em; color: var(--tenue);
    border-bottom: 1px solid var(--borde);
  }
  /* Anclado abajo, como un chat: lo nuevo aparece siempre a la misma altura. */
  .lista {
    flex: 1; overflow-y: auto; padding: 14px 22px 28px; scroll-behavior: smooth;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .lista > * { flex: none; }
  .lista::-webkit-scrollbar { width: 8px; }
  .lista::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 4px; }

  /* Mensajes del canal */
  .msg { margin-bottom: 13px; animation: entra .28s ease-out; }
  .msg .quien { font-weight: 620; font-size: 14px; color: var(--acento); }
  .msg .hora { font-size: 11px; color: var(--tenue); margin-left: 7px; }
  .msg .txt { font-size: 15px; margin-top: 1px; }
  .msg.disparador {
    border-left: 3px solid var(--acento); padding: 9px 13px; margin-left: -16px;
    background: rgba(88,166,255,.09); border-radius: 0 7px 7px 0;
  }
  .msg.disparador::after {
    content: "esto encendió al agente. no lo menciona.";
    display: block; margin-top: 5px; font-size: 11px; color: var(--acento);
    text-transform: uppercase; letter-spacing: .07em;
  }
  @keyframes entra { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* Bitácora */
  .log { display: flex; gap: 11px; margin-bottom: 11px; font-size: 14px; animation: entra .28s ease-out; }
  .log .punto { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
  .log.anotado   .punto { background: var(--anotado); }
  .log.descartado .punto { background: var(--descarte); }
  .log.error     .punto { background: var(--error); }
  .log.descartado { color: var(--tenue); }
  .log .motivo { font-size: 13px; color: var(--tenue); }
  .log.anotado .qué { color: var(--texto); }
  .log .cita {
    display: block; margin-top: 4px; padding-left: 10px;
    border-left: 2px solid var(--borde); font-style: italic; font-size: 13px; color: var(--tenue);
  }

  /* ── El entregable: el privado que llega ── */
  .entregable {
    height: 100%; background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
    animation: llega .5s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes llega { from { opacity: 0; transform: translateX(34px); } to { opacity: 1; transform: none; } }
  .entregable header {
    border-bottom: 1px solid var(--borde); padding: 15px 19px; display: block;
  }
  .entregable .destino { font-size: 12px; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; }
  .entregable .titulo { font-size: 17px; font-weight: 640; margin-top: 3px; }
  .entregable .cuerpo { overflow-y: auto; padding: 7px 0; flex: 1; }

  .bullet { padding: 11px 19px; border-bottom: 1px solid var(--panel-2); display: flex; gap: 11px; }
  .bullet:last-child { border-bottom: 0; }
  .bullet .texto { flex: 1; font-size: 14.5px; }
  .bullet .chips { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--borde); color: var(--tenue);
    background: none; cursor: pointer; font-family: inherit;
  }
  .chip:hover { color: var(--acento); border-color: var(--acento); }
  .chip.fuera { color: var(--fuera); border-color: var(--fuera); cursor: default; }
  .chip.fuera:hover { color: var(--fuera); }
  .prueba {
    margin-top: 8px; padding: 8px 11px; background: var(--panel-2); border-radius: 7px;
    font-size: 13px; font-style: italic; color: var(--tenue);
  }
  .borrar {
    background: none; border: 0; color: var(--tenue); cursor: pointer;
    font-size: 18px; line-height: 1; padding: 2px 5px; border-radius: 5px; font-family: inherit;
  }
  .borrar:hover { color: var(--fuera); background: rgba(247,120,186,.1); }

  .entregable footer {
    border-top: 1px solid var(--borde); padding: 13px 19px;
    display: flex; align-items: center; gap: 13px;
  }
  .compartir {
    background: var(--acento); color: #06101f; border: 0; border-radius: 8px;
    padding: 9px 17px; font-size: 14px; font-weight: 620; cursor: pointer; font-family: inherit;
  }
  .compartir.listo { background: var(--anotado); color: #05180a; }
  .nota { font-size: 12px; color: var(--tenue); }
  .deshacer { background: none; border: 0; color: var(--acento); cursor: pointer; font-size: 12px; font-family: inherit; padding: 0; }

  .vacio { color: var(--tenue); font-size: 14px; padding: 22px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="marca">EL TESTIGO <span id="modo-txt">esperando al replay…</span></div>
  <div class="modo" id="modo">local</div>
  <div class="contador">
    <div class="metrica"><span class="n" id="c-leidos">0</span><span class="r">leídos</span></div>
    <div class="metrica destacada"><span class="n" id="c-anotados">0</span><span class="r">anotó en silencio</span></div>
    <div class="metrica hablo"><span class="n" id="c-hablo">0</span><span class="r">habló</span></div>
  </div>
</header>

<main id="grid">
  <section class="col">
    <h2>El grupo</h2>
    <div class="lista" id="canal"></div>
  </section>
  <section class="col">
    <h2>Qué está decidiendo</h2>
    <div class="lista" id="bitacora"></div>
  </section>
  <section class="col col-entregable" id="entregable"></section>
</main>

<script>
// ── Estado ────────────────────────────────────────────────────────────────────
// La pantalla consume el contrato Estado de src/tipos.ts. Si el replay de P1 no
// está corriendo, cae a una simulación local para poder grabar igual.

const ENDPOINT = "/state";
let estado = null;
let enVivo = false;
let borrados = new Set();
let compartido = false;

const $ = (id) => document.getElementById(id);
const hora = (ts) => new Date(ts).toLocaleTimeString("es-PY", { hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function pedirEstado() {
  // Abierto con doble click no hay servidor: evita inundar la consola con CORS.
  if (location.protocol === "file:") return null;
  try {
    const r = await fetch(ENDPOINT, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    if (!enVivo) { enVivo = true; $("modo").textContent = "en vivo"; $("modo").classList.add("vivo"); $("modo-txt").textContent = "replay conectado"; }
    return await r.json();
  } catch {
    return null;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function pintarContador(c) {
  $("c-leidos").textContent = c.leidos.toLocaleString("es-PY");
  $("c-anotados").textContent = c.anotados.toLocaleString("es-PY");
  $("c-hablo").textContent = c.hablo.toLocaleString("es-PY");
}

function pintarCanal(msgs, disparadorId) {
  const cont = $("canal");
  // Solo agrega lo nuevo: re-dibujar todo mataría la animación y el scroll.
  for (let i = cont.children.length; i < msgs.length; i++) {
    const m = msgs[i];
    const div = document.createElement("div");
    div.className = "msg" + (m.id === disparadorId ? " disparador" : "");
    div.innerHTML = `<div><span class="quien">${esc(m.from)}</span><span class="hora">${hora(m.ts)}</span></div>
                     <div class="txt">${esc(m.text)}</div>`;
    cont.appendChild(div);
  }
  cont.scrollTop = cont.scrollHeight;
}

function pintarBitacora(entradas) {
  const cont = $("bitacora");
  for (let i = cont.children.length; i < entradas.length; i++) {
    const e = entradas[i];
    const div = document.createElement("div");
    div.className = "log " + e.decision;
    div.innerHTML = `<div class="punto"></div>
      <div><div class="qué">${esc(e.motivo)}</div>
      ${e.cita ? `<span class="cita">${esc(e.cita)}</span>` : ""}</div>`;
    cont.appendChild(div);
  }
  cont.scrollTop = cont.scrollHeight;
}

function pintarEntregable(ent) {
  const cont = $("entregable");
  const grid = $("grid");
  if (!ent) { cont.innerHTML = ""; grid.classList.remove("con-entregable"); return; }
  grid.classList.add("con-entregable");

  const vivos = ent.bullets.filter((b) => !borrados.has(b.id));
  const filas = vivos.map((b) => `
    <div class="bullet" data-id="${b.id}">
      <div class="texto">
        ${esc(b.texto)}
        <div class="chips">
          ${b.no_estaba_en_plan ? `<span class="chip fuera">no estaba en tu plan</span>` : ""}
          ${b.links.map((_, i) => `<button class="chip" data-prueba="${b.id}">ver el mensaje ${b.links.length > 1 ? i + 1 : ""}</button>`).join("")}
        </div>
        <div class="prueba" data-para="${b.id}" hidden></div>
      </div>
      <button class="borrar" data-borrar="${b.id}" title="sacar este punto">×</button>
    </div>`).join("");

  const nBorrados = ent.bullets.length - vivos.length;

  cont.innerHTML = `
    <div class="entregable">
      <header>
        <div class="destino">privado para ${esc(ent.persona)}</div>
        <div class="titulo">${vivos.length} puntos · ${esc(ent.periodo)}</div>
      </header>
      <div class="cuerpo">${filas || `<div class="vacio">Sacaste todos los puntos.</div>`}</div>
      <footer>
        <button class="compartir${compartido ? " listo" : ""}" id="btn-compartir">
          ${compartido ? "listo para compartir" : "preparar para compartir"}
        </button>
        <span class="nota">
          ${compartido ? "no se envió nada a nadie" : "no manda nada"}
          ${nBorrados ? ` · ${nBorrados} borrado${nBorrados > 1 ? "s" : ""} <button class="deshacer" id="btn-deshacer">deshacer</button>` : ""}
        </span>
      </footer>
    </div>`;

  cont.querySelectorAll("[data-borrar]").forEach((b) =>
    b.onclick = () => { borrados.add(b.dataset.borrar); pintarEntregable(ent); });

  cont.querySelectorAll("[data-prueba]").forEach((b) =>
    b.onclick = () => {
      const caja = cont.querySelector(`[data-para="${b.dataset.prueba}"]`);
      const bu = ent.bullets.find((x) => x.id === b.dataset.prueba);
      caja.textContent = bu.cita ?? bu.links[0];
      caja.hidden = !caja.hidden;
    });

  const compartir = $("btn-compartir");
  if (compartir) compartir.onclick = () => { compartido = true; pintarEntregable(ent); };
  const deshacer = $("btn-deshacer");
  if (deshacer) deshacer.onclick = () => { borrados.clear(); pintarEntregable(ent); };
}

function pintar(e) {
  if (!e) return;
  pintarContador(e.contador);
  pintarCanal(e.canal, e.disparador?.msg_id ?? null);
  pintarBitacora(e.bitacora);
  pintarEntregable(e.entregable);
}

// ── Simulación local, para poder grabar sin el replay ─────────────────────────
// Se apaga sola en cuanto /state responde.

const GENTE = ["Nico", "Sofi", "Ale", "Lu"];
const CHARLA = [
  ["Nico", "buen día, alguien vio que staging está tirando 502?"],
  ["Lu", "sí, lo estoy mirando"],
  ["Sofi", "hoy tengo la llamada con el cliente a las 11"],
  ["Lu", "era el pool de conexiones, lo subí a 40 y volvió"],
  ["Nico", "listo, ya está arreglado 👌"],
  ["Ale", "gracias Lu por bancar el deploy de anoche"],
  ["Sofi", "el cliente pidió el reporte en PDF también"],
  ["Lu", "lo agrego, es el mismo template"],
  ["Nico", "ojo que el export grande se cuelga"],
  ["Lu", "le puse paginado, probá ahora"],
  ["Ale", "anduvo, gracias"],
  ["Sofi", "alguien sabe dónde quedó el doc de onboarding?"],
  ["Nico", "creo que en Drive"],
  ["Ale", "jaja nadie sabe nunca"],
  ["Lu", "lo migré al wiki la semana pasada, está ahí"],
  ["Sofi", "ah buenísimo"],
  ["Nico", "el viernes hacemos el retro?"],
  ["Ale", "dale"],
  ["Sofi", "che, mañana tengo mi 1:1 con la jefa"],
];
const DECISIONES = [
  ["descartado", "hilo de saludos, no hay trabajo", null],
  ["anotado", "Lu diagnosticó y arregló el 502 de staging", "era el pool de conexiones, lo subí a 40 y volvió"],
  ["anotado", "el arreglo lo cerró otra persona, la evidencia queda a nombre de Lu", "listo, ya está arreglado 👌"],
  ["descartado", "agradecimiento sin acción concreta, ya contado arriba", null],
  ["anotado", "Lu agregó el export en PDF que pidió el cliente", "lo agrego, es el mismo template"],
  ["anotado", "Lu resolvió el cuelgue del export con paginado", "le puse paginado, probá ahora"],
  ["descartado", "conversación sobre dónde está un doc, sin trabajo hecho", null],
  ["anotado", "Lu migró el doc de onboarding al wiki", "lo migré al wiki la semana pasada, está ahí"],
  ["error", "error del modelo: 429, se reintenta. el replay sigue", null],
  ["descartado", "coordinación de agenda, no es trabajo", null],
];
const BULLETS = [
  ["Arreglaste la caída de staging: era el pool de conexiones, lo subiste a 40.", false, "era el pool de conexiones, lo subí a 40 y volvió"],
  ["El arreglo lo anunció Nico, pero lo hiciste vos.", true, "listo, ya está arreglado 👌"],
  ["Resolviste el cuelgue del export grande con paginado.", false, "le puse paginado, probá ahora"],
  ["Agregaste el export en PDF que pidió el cliente de Sofi.", true, "lo agrego, es el mismo template"],
  ["Migraste el doc de onboarding al wiki. Sofi y Nico no sabían dónde estaba.", true, "lo migré al wiki la semana pasada, está ahí"],
  ["Desbloqueaste a Ale dos veces con el export.", false, "anduvo, gracias"],
  ["Bancaste el deploy de anoche.", true, "gracias Lu por bancar el deploy de anoche"],
  ["Fuiste la primera en responder en 4 de los 5 incidentes del mes.", false, "sí, lo estoy mirando"],
];

function simulacion() {
  $("modo-txt").textContent = "modo demo · datos de ejemplo";
  const t0 = Date.now() - 1000 * 60 * 60 * 6;
  const e = {
    contador: { leidos: 1_247, anotados: 0, hablo: 0 },
    canal: [], bitacora: [], disparador: null, entregable: null,
  };
  let i = 0, j = 0;

  const reloj = setInterval(() => {
    if (enVivo) { clearInterval(reloj); return; }

    if (i < CHARLA.length) {
      const [from, text] = CHARLA[i];
      const id = 1000 + i;
      e.canal.push({ id, chat_id: -100, from, text, ts: t0 + i * 90_000, reply_to: null, thread_id: "h" + Math.floor(i / 2), link: "#" });
      e.contador.leidos += 1 + Math.floor(Math.random() * 9);

      // El último mensaje es el disparador: alguien menciona su 1:1 hablando con otro.
      if (i === CHARLA.length - 1) {
        e.disparador = { msg_id: id, texto: text, from, ts: t0 + i * 90_000 };
        e.contador.hablo = 1;
        e.entregable = {
          persona: "Lu",
          periodo: "agosto",
          bullets: BULLETS.map(([texto, fuera, cita], k) => ({
            id: "b" + k, texto, links: ["https://t.me/c/100/" + (1000 + k)],
            no_estaba_en_plan: fuera, borrado: false, cita,
          })),
        };
      }
      i++;
    }

    if (j < DECISIONES.length && i > j + 1) {
      const [decision, motivo, cita] = DECISIONES[j];
      e.bitacora.push({ ts: Date.now(), thread_id: "h" + j, decision, motivo, cita: cita ?? undefined });
      if (decision === "anotado") e.contador.anotados += 1 + Math.floor(Math.random() * 6);
      j++;
    }

    pintar(e);
    if (i >= CHARLA.length && j >= DECISIONES.length) clearInterval(reloj);
  }, 900);
}

// ── Arranque ──────────────────────────────────────────────────────────────────

async function loop() {
  const nuevo = await pedirEstado();
  if (nuevo) { estado = nuevo; pintar(estado); }
  setTimeout(loop, 500);
}

loop();
// Si en 1.5s el replay no contestó, arranca la simulación para no quedarse en blanco.
setTimeout(() => { if (!enVivo) simulacion(); }, 1500);
</script>
</body>
</html>
