<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agente ambiental de voz</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --txt: #e6e8ee;
    --dim: #8b93a7; --acc: #7dd3a0; --warn: #f0b866; --bad: #ef7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 13px; }
  button {
    background: #222735; color: var(--txt); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 13px; cursor: pointer; font-size: 14px;
  }
  button:hover { border-color: #3a4152; }
  button.on { background: var(--acc); color: #0b1a12; border-color: var(--acc); font-weight: 600; }
  input {
    background: #12151c; color: var(--txt); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 10px; font-size: 14px; width: 130px;
  }
  #nivel { width: 90px; height: 8px; background: #12151c; border-radius: 4px; overflow: hidden; }
  #nivelIn { height: 100%; width: 0%; background: var(--acc); transition: width .05s linear; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line);
         height: calc(100vh - 59px); }
  section { background: var(--bg); overflow-y: auto; padding: 16px 20px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .9px;
       color: var(--dim); margin: 0 0 14px; font-weight: 600; }
  .frase { margin-bottom: 9px; }
  .frase b { color: var(--acc); font-weight: 600; }
  .dec { border-left: 2px solid var(--line); padding: 3px 0 3px 11px; margin-bottom: 7px;
         color: var(--dim); font-size: 13.5px; }
  .dec .motivo { color: #5f6779; }
  .dec.hab { border-left-color: var(--warn); color: var(--txt); }
  .dec.hab .msg { color: var(--warn); font-weight: 600; margin: 3px 0; }
  .dec .ev { color: var(--dim); font-size: 12.5px; font-style: italic; }
  .pend { border: 1px solid var(--warn); border-radius: 8px; padding: 11px;
          margin-bottom: 10px; background: #1d1a12; }
  .pend .q { margin-bottom: 9px; }
  .hecho { color: var(--acc); font-size: 13px; margin-bottom: 5px; font-family: ui-monospace, monospace; }
  .vacio { color: #4c5364; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Agente ambiental de voz</h1>
  <span class="sub" id="meta">…</span>
  <span style="flex:1"></span>
  <input id="speaker" placeholder="tu nombre" />
  <div id="nivel"><div id="nivelIn"></div></div>
  <button id="escuchar">Escuchar</button>
  <button id="mute">Mute</button>
  <button id="why">¿Por qué?</button>
  <button id="status">Status</button>
  <button id="reset">Reset</button>
</header>

<main>
  <section>
    <h2>Lo que se dijo en la sala</h2>
    <div id="frases" class="vacio">Nadie habló todavía.</div>
  </section>
  <section>
    <h2>Qué decidió el agente</h2>
    <div id="pendientes"></div>
    <div id="bitacora" class="vacio">Sin decisiones.</div>
    <h2 style="margin-top:22px">Acciones ejecutadas</h2>
    <div id="registro" class="vacio">Ninguna.</div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
